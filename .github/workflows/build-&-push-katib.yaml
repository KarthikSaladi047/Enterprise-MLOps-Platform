name: Build and push training-container image

on:
  push:
    branches:
      - main
    paths:
      - "5-hyperparameter-tunning/**"
    paths-ignore:
      - "5-hyperparameter-tunning/3-katib-experiment.yaml"

  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare variables
        id: vars
        run: |
          echo "lower_repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push image
        uses: docker/build-push-action@v6
        with:
          context: 5-hyperparameter-tunning
          file: 5-hyperparameter-tunning/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.lower_repo }}/training-container:${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ steps.vars.outputs.lower_repo }}/training-container:latest

      - name: Update Katib Experiment image
        run: |
          IMAGE="ghcr.io/${{ steps.vars.outputs.lower_repo }}/training-container:${{ steps.vars.outputs.sha_short }}"

          sed -i \
            "s|^\(\s*image:\s*\).*|\1${IMAGE}|" \
            5-hyperparameter-tunning/3-katib-experiment.yaml

          echo "Updated image to:"
          grep "image:" 5-hyperparameter-tunning/3-katib-experiment.yaml

      - name: Commit updated manifest
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add 5-hyperparameter-tunning/3-katib-experiment.yaml

          if git diff --cached --quiet; then
            echo "No manifest changes."
            exit 0
          fi

          git commit -m "Update training image to ${{ steps.vars.outputs.sha_short }} [skip ci]"
          git push