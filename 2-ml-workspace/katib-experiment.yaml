apiVersion: kubeflow.org/v1beta1
kind: Experiment
metadata:
  name: enterprise-text-classifier-tuning
  namespace: kubeflow
spec:
  # 1. The Optimization Goal
  objective:
    type: minimize
    goal: 0.0001
    objectiveMetricName: final_loss

  # 2. The Search Algorithm (Bayesian Optimization)
  algorithm:
    algorithmName: bayesianoptimization

  # 3. Parallelism and Trial Limits
  parallelTrialCount: 3
  maxTrialCount: 6
  maxFailedTrialCount: 2

  # 4. The Hyperparameter Search Space
  parameters:
    - name: learning_rate
      parameterType: double
      feasibleSpace:
        min: "1e-5"
        max: "1e-4"
    - name: batch_size
      parameterType: int
      feasibleSpace:
        min: "8"
        max: "32"
        step: "8"

  # 5. The Trial Pod Template
  trialTemplate:
    primaryContainerName: training-container
    trialParameters:
      - name: learningRate
        description: Learning rate for the model
        reference: learning_rate
      - name: batchSize
        description: Batch size for training
        reference: batch_size
    trialSpec:
      apiVersion: batch/v1
      kind: Job
      spec:
        ttlSecondsAfterFinished: 300
        backoffLimit: 0
        template:
          spec:
            # 🚨 EXACT HARDWARE ROUTING TO COMPUTE NODES 🚨
            nodeSelector:
              node-role.kubernetes.io/compute: "true"
            tolerations:
              - key: "dedicated"
                operator: "Equal"
                value: "compute"
                effect: "NoSchedule"
            restartPolicy: Never
            containers:
              - name: training-container
                # TODO: replace with a prebuilt image containing:
                # mlflow==3.14.0 boto3 transformers==4.37.1 torch==2.12.1
                # torchvision==0.27.1 pandas dvc[s3] git packaging>=24.0
                # This avoids installing ~1-2GB of packages on every trial.
                image: python:3.10-slim
                resources:
                  requests:
                    cpu: "2"
                    memory: 4Gi
                  limits:
                    cpu: "4"
                    memory: 8Gi
                # Explicit, least-privilege env mapping -- mirrors the
                # secret_mapping used in hf_pipeline.py's mlops_pipeline().
                # Only what training actually needs, nothing else from
                # infra-credentials (e.g. no KUBEFLOW_HOST here).
                env:
                  - name: GIT_REPO_URL
                    valueFrom:
                      secretKeyRef:
                        name: infra-credentials
                        key: GIT_REPO_URL
                  - name: AWS_ENDPOINT_URL
                    valueFrom:
                      secretKeyRef:
                        name: infra-credentials
                        key: AWS_ENDPOINT_URL
                  - name: AWS_ACCESS_KEY_ID
                    valueFrom:
                      secretKeyRef:
                        name: infra-credentials
                        key: AWS_ACCESS_KEY_ID
                  - name: AWS_SECRET_ACCESS_KEY
                    valueFrom:
                      secretKeyRef:
                        name: infra-credentials
                        key: AWS_SECRET_ACCESS_KEY
                  - name: MLFLOW_TRACKING_URI
                    valueFrom:
                      secretKeyRef:
                        name: infra-credentials
                        key: MLFLOW_TRACKING_URI
                  - name: MLFLOW_S3_ENDPOINT_URL
                    valueFrom:
                      secretKeyRef:
                        name: infra-credentials
                        key: AWS_ENDPOINT_URL
                  - name: PIP_ROOT_USER_ACTION
                    value: "ignore"
                  - name: PIP_DISABLE_PIP_VERSION_CHECK
                    value: "1"
                command:
                  - /bin/bash
                  - -c
                args:
                  - |
                    set -e

                    apt-get update -qq
                    apt-get install -y -qq git > /dev/null

                    pip install --quiet --no-cache-dir \
                      packaging>=24.0 \
                      mlflow==3.14.0 \
                      boto3 \
                      transformers==4.37.1 \
                      torch==2.12.1 \
                      torchvision==0.27.1 \
                      pandas \
                      "dvc[s3]"

                    python3 - <<'PY'
                    import argparse
                    import os
                    import subprocess
                    import warnings

                    import pandas as pd
                    import torch
                    import mlflow
                    from transformers import AutoTokenizer, AutoModelForSequenceClassification
                    from transformers import logging as hf_logging
                    from torch.utils.data import TensorDataset, DataLoader

                    warnings.filterwarnings("ignore", category=FutureWarning, module="huggingface_hub")
                    hf_logging.set_verbosity_error()
                    os.environ["GIT_PYTHON_REFRESH"] = "quiet"

                    parser = argparse.ArgumentParser()
                    parser.add_argument("--learning_rate", type=float, required=True)
                    parser.add_argument("--batch_size", type=int, required=True)
                    args = parser.parse_args()

                    # --- Pull data via DVC, exactly like prep_data() in hf_pipeline.py ---
                    git_repo_url = os.environ["GIT_REPO_URL"]
                    subprocess.run(["git", "clone", git_repo_url, "/tmp/repo"], check=True)
                    os.chdir("/tmp/repo/2-ml-workspace")

                    subprocess.run(["dvc", "remote", "modify", "--local", "minio-remote",
                                     "endpointurl", os.environ["AWS_ENDPOINT_URL"]], check=True)
                    subprocess.run(["dvc", "remote", "modify", "--local", "minio-remote",
                                     "access_key_id", os.environ["AWS_ACCESS_KEY_ID"]], check=True)
                    subprocess.run(["dvc", "remote", "modify", "--local", "minio-remote",
                                     "secret_access_key", os.environ["AWS_SECRET_ACCESS_KEY"]], check=True)
                    subprocess.run(["dvc", "pull", "-r", "minio-remote"], check=True)

                    df = pd.read_csv("data/dataset.csv")
                    print(f"Loaded {len(df)} rows from DVC.")

                    # --- Training loop, mirrors train_and_register() in hf_pipeline.py ---
                    model_name = "prajjwal1/bert-tiny"
                    tokenizer = AutoTokenizer.from_pretrained(model_name)
                    model = AutoModelForSequenceClassification.from_pretrained(model_name, num_labels=2)

                    inputs = tokenizer(
                        df["text"].tolist(),
                        padding=True,
                        truncation=True,
                        max_length=512,
                        return_tensors="pt",
                    )
                    labels = torch.tensor(df["label"].tolist())

                    dataloader = DataLoader(
                        TensorDataset(inputs["input_ids"], inputs["attention_mask"], labels),
                        batch_size=args.batch_size,
                        shuffle=True,
                    )

                    optimizer = torch.optim.AdamW(model.parameters(), lr=args.learning_rate)
                    model.train()

                    epochs = 3
                    avg_loss = None
                    for epoch in range(epochs):
                        total_loss = 0
                        for b_input_ids, b_mask, b_labels in dataloader:
                            optimizer.zero_grad()
                            outputs = model(input_ids=b_input_ids, attention_mask=b_mask, labels=b_labels)
                            outputs.loss.backward()
                            optimizer.step()
                            total_loss += outputs.loss.item()
                        avg_loss = total_loss / len(dataloader)
                        print(f"Epoch {epoch+1}/{epochs} | Average Loss: {avg_loss:.4f}")

                    # --- Log params/metrics only. No model registration during tuning trials. ---
                    mlflow.set_experiment("katib-hyperparameter-tuning")
                    with mlflow.start_run():
                        mlflow.log_param("learning_rate", args.learning_rate)
                        mlflow.log_param("batch_size", args.batch_size)
                        mlflow.log_metric("final_loss", avg_loss)

                    # Katib's default StdOut metrics collector parses this line.
                    print(f"final_loss={avg_loss}")
                    PY
                  - "--learning_rate=${trialParameters.learningRate}"
                  - "--batch_size=${trialParameters.batchSize}"