apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: enterprise-text-classifier
  namespace: default
spec:
  predictor:
    nodeSelector:
      node-role.kubernetes.io/apps: 'true'
    tolerations:
    - key: dedicated
      operator: Equal
      value: apps
      effect: NoSchedule
    serviceAccountName: kserve-sa
    model:
      modelFormat:
        name: mlflow
      storageUri: s3://mlflow-artifacts/2/models/m-ee4358fcef98414faa7186428e7210cb/artifacts
    canaryTrafficPercent: 10
    canary:
      modelFormat:
        name: mlflow
      storageUri: s3://mlflow-artifacts/2/models/m-f0d4776a1f3449449002a2e8bb7a5767/artifacts
