---
# ============================================================
# 3) Katib Experiment — pure HPO search.
#    Reads pre-split data from the shared PVC.
#    Metrics reported via stdout ("final_loss=...") using
#    Katib's built-in StdOut collector.
# ============================================================
apiVersion: kubeflow.org/v1beta1
kind: Experiment
metadata:
  name: enterprise-text-classifier-tuning
  namespace: kubeflow
spec:
  objective:
    type: minimize
    goal: 0.05
    objectiveMetricName: final_loss

  metricsCollectorSpec:
    collector:
      kind: StdOut

  algorithm:
    algorithmName: bayesianoptimization

  parallelTrialCount: 10
  maxTrialCount: 48
  maxFailedTrialCount: 2

  parameters:
    - name: learning_rate
      parameterType: double
      feasibleSpace:
        min: "0.00001"
        max: "0.01"
    - name: batch_size
      parameterType: int
      feasibleSpace:
        min: "4"
        max: "32"
        step: "4"

  trialTemplate:
    primaryContainerName: training-container
    trialParameters:
      - name: learningRate
        description: Learning rate for the model
        reference: learning_rate
      - name: batchSize
        description: Batch size for training
        reference: batch_size
    trialSpec:
      apiVersion: batch/v1
      kind: Job
      spec:
        backoffLimit: 0
        template:
          spec:
            restartPolicy: Never
            volumes:
              - name: shared-data
                persistentVolumeClaim:
                  claimName: hpo-shared-data
                  readOnly: true
            containers:
              - name: training-container
                image: ghcr.io/karthiksaladi047/enterprise-mlops-platform/training-container:c860a89
                resources:
                  requests:
                    cpu: "1"
                    memory: 2Gi
                  limits:
                    cpu: "2"
                    memory: 4Gi
                env:
                  - name: TRIAL_LEARNING_RATE
                    value: "${trialParameters.learningRate}"
                  - name: TRIAL_BATCH_SIZE
                    value: "${trialParameters.batchSize}"
                  - name: DATASET_PATH
                    value: /shared/dataset.csv
                volumeMounts:
                  - name: shared-data
                    mountPath: /shared